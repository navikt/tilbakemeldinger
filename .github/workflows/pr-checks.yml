name: PR Checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    with:
      push-image: false
      # The same checks as the deploys, so a failure shows up before the merge
      post-build-commands: pnpm run test:dist
      sbom-from-lockfile: true
      # What the build bakes into the app (vite.config.ts), with dev's values
      env-file: |
        ENV=dev
        VITE_APP_BASEPATH=/person/kontakt-oss
        VITE_APP_ORIGIN=https://www.ansatt.dev.nav.no
        VITE_TELEMETRY_URL=https://telemetry.ekstern.dev.nav.no/collect
        CDN_BASE=https://cdn.nav.no/navno/tilbakemeldinger/dev
    secrets: inherit
