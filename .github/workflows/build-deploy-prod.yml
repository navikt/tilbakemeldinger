# Builds main and deploys it to prod - shared by deploy.prod.yml and base-image-refresh.yml
# Callers need `permissions: { contents: read, id-token: write }` and `secrets: inherit`.
name: Build and deploy to prod
on: workflow_call

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      image-suffix: release-${{ github.ref_name }}
      cdn-source: ./dist/client/assets
      cdn-destination: tilbakemeldinger/prod
      # The image ships the bundled build without node_modules (Dockerfile), so there's nothing to prune,
      # the SBOM comes from the lockfile, and test:dist runs the build without node_modules first
      post-build-commands: pnpm run test:dist
      prune-remove: ''
      sbom-from-lockfile: true
      # What the build bakes into the app (vite.config.ts). What only the server reads is in .nais/config.yml
      env-file: |
        CDN_BASE=https://cdn.nav.no/navno/tilbakemeldinger/prod
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      cluster: prod-gcp
      resource: .nais/config.yml
      vars: .nais/vars-prod.yml
      var: image=${{ needs.build.outputs.image }}
