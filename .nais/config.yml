---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tilbakemeldinger
  namespace: navno
  labels:
    team: navno
spec:
  image: {{image}}
  port: 9001
  ingresses:
  {{#each ingresses as |url|}}
     - {{url}}
  {{/each}}
  liveness:
    path: /person/kontakt-oss/tilbakemeldinger/api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /person/kontakt-oss/tilbakemeldinger/api/internal/isReady
    initialDelay: 10
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    logging:
        destinations:
          - id: elastic
          - id: loki
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  # What only the server reads. What the build bakes into the app is in the workflows' env-file
  env:
    # The port above
    - name: APP_PORT
      value: '9001'
    # Through service discovery, so the same in both clusters
    - name: API_URL
      value: http://tilbakemeldingsmottak-api.teamserviceklage
    - name: NORG2_ORIGIN
      value: https://{{norg2Host}}
    - name: VITE_EDITORIAL_FRONTPAGE_ORIGIN
      value: {{editorialFrontPage}}
  azure:
    application:
      enabled: true
  tokenx:
    enabled: true
  idporten:
    enabled: true
    sidecar:
      enabled: true
      level: Level3
  accessPolicy:
    outbound:
      rules:
        - application: tilbakemeldingsmottak-api
          namespace: teamserviceklage
        - application: nav-dekoratoren
          namespace: personbruker
      external:
        - host: {{norg2Host}}
  replicas:
  {{#with replicas}}
    min: {{min}}
    max: {{max}}
  {{/with}}
  resources:
  {{#with resources}}
    requests:
      cpu: {{requests.cpu}}
      memory: {{requests.memory}}
    limits:
      memory: {{limits.memory}}
  {{/with}}
